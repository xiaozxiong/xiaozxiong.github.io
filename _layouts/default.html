<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{{ site.description | strip_newlines | xml_escape }}" />
  <title>{{ site.title | escape }}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,650;14..32,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}" />
  <link rel="icon" type="image/png" href="{{ '/images/logo.png' | relative_url }}?v={{ site.time | date: '%s' }}" />

</head>
<body{% if page.page_class %} class="{{ page.page_class | escape }}"{% endif %}>

  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="top-nav" id="top-nav">
    <div class="nav-inner">
      <a class="nav-brand" href="{{ '/' | relative_url }}" aria-label="{{ site.data.profile.name | escape }} — Home"><img class="nav-logo" src="{{ '/images/logo.png' | relative_url }}?v={{ site.time | date: '%s' }}" alt="ZX" width="56" height="56" /></a>
      <nav class="nav-links" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}" class="nav-item" {% if page.url == '/' %}aria-current="page"{% endif %}><i class="fa-solid fa-house" aria-hidden="true"></i> Home</a>
        <a href="{{ '/publications' | relative_url }}" class="nav-item" {% if page.url contains 'publications' %}aria-current="page"{% endif %}><i class="fa-solid fa-book-open" aria-hidden="true"></i> Publications</a>
      </nav>
    </div>
  </header>

  <div class="wrap site-layout">
    {% include profile.html %}
    <main class="main" id="main-content">
      {{ content }}
    </main>
  </div>

  <footer>
    <p>{{ site.data.profile.name }} &copy; <span id="year"></span></p>
  </footer>

  <script>
    // ── Footer year ──────────────────────────────────────
    document.getElementById('year').textContent = new Date().getFullYear();

    // ── Photo fallback ───────────────────────────────────
    (function() {
      var img = document.getElementById('id-photo');
      var fb  = document.getElementById('id-fb');
      if (!img || !fb) return;
      function showFallback() {
        img.style.display = 'none';
        fb.style.display = 'flex';
      }
      img.addEventListener('error', showFallback);
      if (img.complete && img.naturalWidth === 0) showFallback();
      {% unless site.data.profile.photo %}
      img.style.display = 'none';
      fb.style.display = 'flex';
      {% endunless %}
    })();

    // Open external websites and downloadable documents in a new tab.
    document.querySelectorAll('.wrap a[href]').forEach(function(link) {
      var url = new URL(link.href, window.location.href);
      var isWebsite = url.protocol === 'http:' || url.protocol === 'https:';
      var isExternal = isWebsite && url.origin !== window.location.origin;
      var isDocument = isWebsite && /\.(pdf|pptx?|docx?)(?:$)/i.test(url.pathname);
      if (isExternal || isDocument) {
        link.setAttribute('target', '_blank');
        link.relList.add('noopener');
      }
    });

    // ── Navigation active tracking ───────────────────────
    (function() {
      var items = document.querySelectorAll('.nav-item');
      if (!items.length) return;
      var path = window.location.pathname.replace(/\/$/, '') || '/';
      items.forEach(function(link) {
        var href = link.getAttribute('href');
        if (href === path || (path !== '/' && href !== '/' && path.startsWith(href))) {
          link.classList.add('active');
        }
      });
    })();
  </script>
</body>
</html>
